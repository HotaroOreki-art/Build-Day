<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Simple Countdown Timer</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f172a;
      color: #e5e7eb;
    }

    .timer-card {
      background: #111827;
      padding: 24px 28px;
      border-radius: 16px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.5);
      width: 320px;
    }

    .timer-card h1 {
      font-size: 1.4rem;
      margin: 0 0 12px;
      text-align: center;
    }

    .description {
      font-size: 0.85rem;
      color: #9ca3af;
      text-align: center;
      margin-bottom: 16px;
    }

    label {
      font-size: 0.9rem;
      display: block;
      margin-bottom: 6px;
    }

    .input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }

    input[type="number"] {
      flex: 1;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid #374151;
      background: #020617;
      color: #e5e7eb;
      outline: none;
    }

    input[type="number"]:focus {
      border-color: #60a5fa;
    }

    .controls-row {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-bottom: 16px;
    }

    button {
      padding: 8px 14px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      background: #3b82f6;
      color: white;
      font-weight: 500;
      transition: transform 0.08s ease, box-shadow 0.08s ease, background 0.15s ease;
      white-space: nowrap;
      font-size: 0.85rem;
    }

    button:hover {
      background: #2563eb;
      box-shadow: 0 8px 18px rgba(37, 99, 235, 0.35);
      transform: translateY(-1px);
    }

    button:active {
      transform: translateY(0);
      box-shadow: none;
    }

    .countdown-display {
      margin-top: 10px;
      font-size: 2.2rem;
      text-align: center;
      letter-spacing: 2px;
    }

    .status {
      margin-top: 6px;
      font-size: 0.85rem;
      text-align: center;
      color: #9ca3af;
      min-height: 18px;
    }

    .status.error {
      color: #fca5a5;
    }

    .notification-hint {
      margin-top: 12px;
      font-size: 0.75rem;
      text-align: center;
      color: #6b7280;
    }
  </style>
</head>
<body>

  <div class="timer-card">
    <h1>Countdown Timer</h1>
    <p class="description">Enter seconds, hit start, and get a notification + beep at the end.</p>

    <label for="secondsInput">Seconds</label>
    <div class="input-row">
      <input
        type="number"
        id="secondsInput"
        min="1"
        placeholder="e.g. 10"
      />
      <button id="startBtn">Start</button>
    </div>

    <!---- control buttons -->
    <div class="controls-row">
      <button id="pauseBtn">Pause</button>
      <button id="resetBtn">Reset</button>
    </div>

    <div id="countdown" class="countdown-display">0</div>
    <div id="status" class="status"></div>
    <p class="notification-hint">
      Tip: Allow notifications in your browser for the alert.
    </p>
  </div>

  <script>
    const secondsInput = document.getElementById("secondsInput");
    const startBtn = document.getElementById("startBtn");
    const pauseBtn = document.getElementById("pauseBtn");
    const resetBtn = document.getElementById("resetBtn");
    const countdownEl = document.getElementById("countdown");
    const statusEl = document.getElementById("status");

    let timerId = null;
    let remaining = 0;
    let isPaused = false;

    // Play a simple beep using the Web Audio API
    function playBeep() {
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const oscillator = audioCtx.createOscillator();
      const gainNode = audioCtx.createGain();

      oscillator.type = "sine";         // tone type
      oscillator.frequency.value = 600; // Hz (pitch)

      oscillator.connect(gainNode);
      gainNode.connect(audioCtx.destination);

      oscillator.start();

      // 1 second beep
      setTimeout(() => {
        oscillator.stop();
        audioCtx.close();
      }, 1000);
    }

    // Show a browser notification
    function showNotification(message) {
      if (!("Notification" in window)) {
        console.log("This browser does not support notifications.");
        return;
      }

      if (Notification.permission === "granted") {
        new Notification(message);
      } else if (Notification.permission !== "denied") {
        Notification.requestPermission().then((permission) => {
          if (permission === "granted") {
            new Notification(message);
          }
        });
      }
    }

    function startTimer() {
      // If timer is already running
      if (timerId !== null) return;

      // If we are resuming from pause
      if (isPaused && remaining > 0) {
        isPaused = false;
        statusEl.textContent = "Timer is running...";
        statusEl.classList.remove("error");
        runInterval();
        return;
      }

      // Fresh start 
      const inputVal = Number(secondsInput.value);

      if (!inputVal || inputVal <= 0) {
        statusEl.textContent = "Please enter a positive number of seconds.";
        statusEl.classList.add("error");
        countdownEl.textContent = "0";
        return;
      }

      statusEl.textContent = "Timer is running...";
      statusEl.classList.remove("error");

      remaining = Math.floor(inputVal);
      countdownEl.textContent = remaining;

      runInterval();
    }

    function runInterval() {
      timerId = setInterval(() => {
        remaining -= 1;
        countdownEl.textContent = remaining;

        if (remaining <= 0) {
          clearInterval(timerId);
          timerId = null;
          isPaused = false;
          countdownEl.textContent = "0";
          statusEl.textContent = "Time's up!";

          // Trigger notification and beep
          showNotification("Timer finished!");
          playBeep();
        }
      }, 1000);
    }

    function pauseTimer() {
      if (timerId !== null) {
        clearInterval(timerId);
        timerId = null;
        isPaused = true;
        statusEl.textContent = "Paused.";
      }
    }

    function resetTimer() {
      if (timerId !== null) {
        clearInterval(timerId);
      }
      timerId = null;
      isPaused = false;
      remaining = 0;
      countdownEl.textContent = "0";
      statusEl.textContent = "";
      secondsInput.value = "";
    }

    startBtn.addEventListener("click", startTimer);
    pauseBtn.addEventListener("click", pauseTimer);
    resetBtn.addEventListener("click", resetTimer);
  </script>
</body>
</html>
